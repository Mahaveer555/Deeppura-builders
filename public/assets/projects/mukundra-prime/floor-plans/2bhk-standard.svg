<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 680" width="100%" height="100%">
  <defs>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#EAECEF" stroke-width="0.75" />
    </pattern>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10243A" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="950" height="680" fill="#FAF9F6" />
  <rect x="25" y="25" width="900" height="630" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow2)" />
  <rect x="30" y="30" width="890" height="620" fill="url(#grid2)" opacity="0.6" />

  <!-- Title Block Header -->
  <rect x="50" y="45" width="850" height="70" rx="8" fill="#10243A" />
  <text x="75" y="80" font-family="'Cinzel', Georgia, serif" font-size="20" font-weight="700" fill="#FAF9F6" letter-spacing="2">MUKUNDRA PRIME</text>
  <text x="75" y="100" font-family="'Manrope', sans-serif" font-size="12" font-weight="600" fill="#C5A46D" letter-spacing="1.5">RESIDENTIAL APARTMENTS • RAIPURA, KOTA</text>
  <rect x="690" y="57" width="190" height="46" rx="6" fill="#172E46" stroke="#C5A46D" stroke-width="1" />
  <text x="785" y="78" font-family="'Cinzel', serif" font-size="15" font-weight="700" fill="#FAF9F6" text-anchor="middle">2 BHK STANDARD</text>
  <text x="785" y="94" font-family="'Manrope', sans-serif" font-size="10" font-weight="600" fill="#C5A46D" text-anchor="middle">DUAL BALCONY RESIDENCE</text>

  <!-- North Arrow -->
  <g transform="translate(850, 160)">
    <circle cx="0" cy="0" r="22" fill="#FAF9F6" stroke="#10243A" stroke-width="1.5"/>
    <polygon points="0,-18 5,0 0,-4 -5,0" fill="#C5A46D" />
    <polygon points="0,18 5,0 0,4 -5,0" fill="#10243A" />
    <text x="0" y="-23" font-family="'Cinzel', serif" font-size="12" font-weight="800" fill="#10243A" text-anchor="middle">N</text>
  </g>

  <!-- Main Walls (Thick Navy) -->
  <g stroke="#10243A" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter" fill="none">
    <rect x="120" y="150" width="700" height="440" />
    <!-- Divisions -->
    <!-- Living to Master Bed -->
    <line x1="470" y1="150" x2="470" y2="430" />
    <!-- Living to Kitchen / Dining -->
    <line x1="120" y1="380" x2="470" y2="380" />
    <!-- Master Bed to Bedroom 2 -->
    <line x1="640" y1="150" x2="640" y2="430" />
    <!-- Lower Bath Block -->
    <line x1="470" y1="430" x2="820" y2="430" />
    <line x1="600" y1="430" x2="600" y2="590" />
    <line x1="710" y1="430" x2="710" y2="590" />
  </g>

  <!-- Balconies -->
  <g stroke="#C5A46D" stroke-width="3" stroke-dasharray="6,4" fill="rgba(197, 164, 109, 0.08)">
    <rect x="120" y="590" width="350" height="45" />
    <rect x="820" y="150" width="55" height="280" />
  </g>

  <!-- Room 1: Living & Dining -->
  <rect x="124" y="154" width="342" height="222" fill="rgba(16, 36, 58, 0.03)" />
  <g font-family="'Manrope', sans-serif">
    <text x="295" y="245" font-size="17" font-weight="700" fill="#10243A" text-anchor="middle">LIVING &amp; DINING HALL</text>
    <text x="295" y="268" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">FAMILY GATHERING ZONE</text>
    <rect x="230" y="280" width="130" height="24" rx="4" fill="#F1F5F9" />
    <text x="295" y="296" font-size="11" font-weight="700" fill="#C5A46D" text-anchor="middle">DECK BALCONY</text>
  </g>

  <!-- Room 2: Kitchen & Utility -->
  <rect x="124" y="384" width="342" height="202" fill="rgba(16, 36, 58, 0.03)" />
  <g font-family="'Manrope', sans-serif">
    <rect x="124" y="384" width="60" height="202" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
    <text x="295" y="475" font-size="16" font-weight="700" fill="#10243A" text-anchor="middle">MODERN KITCHEN</text>
    <text x="295" y="495" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">SEPARATE UTILITY WASH</text>
  </g>

  <!-- Room 3: Master Bedroom -->
  <rect x="474" y="154" width="162" height="272" fill="rgba(197, 164, 109, 0.05)" />
  <g font-family="'Manrope', sans-serif">
    <text x="555" y="260" font-size="16" font-weight="700" fill="#10243A" text-anchor="middle">MASTER</text>
    <text x="555" y="280" font-size="16" font-weight="700" fill="#10243A" text-anchor="middle">BEDROOM</text>
    <text x="555" y="305" font-size="11" font-weight="600" fill="#8C6D3B" text-anchor="middle">ATTACHED TOILET</text>
  </g>

  <!-- Room 4: Bedroom 2 (Guest / Kids) -->
  <rect x="644" y="154" width="172" height="272" fill="rgba(16, 36, 58, 0.03)" />
  <g font-family="'Manrope', sans-serif">
    <text x="730" y="260" font-size="16" font-weight="700" fill="#10243A" text-anchor="middle">BEDROOM 2</text>
    <text x="730" y="285" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">BALCONY VIEW</text>
  </g>

  <!-- Lower Block: Toilets & Passage -->
  <rect x="474" y="434" width="122" height="152" fill="#F8FAFC" />
  <text x="535" y="505" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#10243A" text-anchor="middle">ATTACHED</text>
  <text x="535" y="522" font-family="'Manrope', sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">BATH</text>

  <rect x="604" y="434" width="102" height="152" fill="#F8FAFC" />
  <text x="655" y="505" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#10243A" text-anchor="middle">COMMON</text>
  <text x="655" y="522" font-family="'Manrope', sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">BATH</text>

  <rect x="714" y="434" width="102" height="152" fill="#FDF8F0" />
  <text x="765" y="505" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#10243A" text-anchor="middle">ENTRANCE</text>
  <text x="765" y="522" font-family="'Manrope', sans-serif" font-size="11" font-weight="600" fill="#8C6D3B" text-anchor="middle">FOYER</text>

  <!-- Door Swings -->
  <g stroke="#C5A46D" stroke-width="1.5" fill="none">
    <path d="M 770,590 A 45 45 0 0 1 815,545" stroke-dasharray="3,3" />
    <line x1="770" y1="590" x2="770" y2="545" stroke="#10243A" stroke-width="3" />
    <text x="790" y="618" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#10243A" text-anchor="middle">MAIN ENTRY</text>
  </g>

  <!-- Labels -->
  <text x="295" y="618" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#C5A46D" text-anchor="middle">WIDE LIVING BALCONY</text>
  <text x="850" y="290" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#C5A46D" text-anchor="middle" transform="rotate(90, 850, 290)">BEDROOM 2 BALCONY</text>

  <!-- Footer Disclaimer -->
  <rect x="50" y="620" width="850" height="30" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
  <text x="70" y="640" font-family="'Manrope', sans-serif" font-size="10" font-weight="600" fill="#64748B">
    CONFIRMED ARCHITECTURAL PLAN • 2 BEDROOMS, 2 BATHROOMS, DUAL BALCONIES • DEEPPURA GROUP
  </text>
</svg>

