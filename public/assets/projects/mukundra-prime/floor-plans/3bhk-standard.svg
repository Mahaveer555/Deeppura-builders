<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <pattern id="grid3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#EAECEF" stroke-width="0.75" />
    </pattern>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10243A" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="1000" height="700" fill="#FAF9F6" />
  <rect x="25" y="25" width="950" height="650" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow3)" />
  <rect x="30" y="30" width="940" height="640" fill="url(#grid3)" opacity="0.6" />

  <!-- Header -->
  <rect x="50" y="45" width="900" height="70" rx="8" fill="#10243A" />
  <text x="75" y="80" font-family="'Cinzel', Georgia, serif" font-size="20" font-weight="700" fill="#FAF9F6" letter-spacing="2">MUKUNDRA PRIME</text>
  <text x="75" y="100" font-family="'Manrope', sans-serif" font-size="12" font-weight="600" fill="#C5A46D" letter-spacing="1.5">RESIDENTIAL APARTMENTS • RAIPURA, KOTA</text>
  <rect x="730" y="57" width="200" height="46" rx="6" fill="#172E46" stroke="#C5A46D" stroke-width="1" />
  <text x="830" y="78" font-family="'Cinzel', serif" font-size="15" font-weight="700" fill="#FAF9F6" text-anchor="middle">3 BHK STANDARD</text>
  <text x="830" y="94" font-family="'Manrope', sans-serif" font-size="10" font-weight="600" fill="#C5A46D" text-anchor="middle">PREMIUM 3 BED RESIDENCE</text>

  <!-- North Arrow -->
  <g transform="translate(890, 160)">
    <circle cx="0" cy="0" r="22" fill="#FAF9F6" stroke="#10243A" stroke-width="1.5"/>
    <polygon points="0,-18 5,0 0,-4 -5,0" fill="#C5A46D" />
    <polygon points="0,18 5,0 0,4 -5,0" fill="#10243A" />
    <text x="0" y="-23" font-family="'Cinzel', serif" font-size="12" font-weight="800" fill="#10243A" text-anchor="middle">N</text>
  </g>

  <!-- Walls -->
  <g stroke="#10243A" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter" fill="none">
    <rect x="100" y="145" width="760" height="460" />
    <!-- Divisions -->
    <line x1="390" y1="145" x2="390" y2="440" />
    <line x1="620" y1="145" x2="620" y2="440" />
    <line x1="100" y1="390" x2="390" y2="390" />
    <line x1="390" y1="440" x2="860" y2="440" />
    <line x1="510" y1="440" x2="510" y2="605" />
    <line x1="640" y1="440" x2="640" y2="605" />
    <line x1="750" y1="440" x2="750" y2="605" />
  </g>

  <!-- Balconies -->
  <g stroke="#C5A46D" stroke-width="3" stroke-dasharray="6,4" fill="rgba(197, 164, 109, 0.08)">
    <rect x="100" y="605" width="290" height="45" />
    <rect x="860" y="145" width="55" height="295" />
    <rect x="100" y="100" width="290" height="45" />
  </g>

  <!-- Room 1: Living & Dining Grand Hall -->
  <rect x="104" y="149" width="282" height="237" fill="rgba(16, 36, 58, 0.03)" />
  <g font-family="'Manrope', sans-serif">
    <text x="245" y="245" font-size="17" font-weight="700" fill="#10243A" text-anchor="middle">LIVING &amp; DINING</text>
    <text x="245" y="268" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">EXPANSIVE FAMILY HALL</text>
    <rect x="180" y="280" width="130" height="24" rx="4" fill="#F1F5F9" />
    <text x="245" y="296" font-size="11" font-weight="700" fill="#C5A46D" text-anchor="middle">DUAL BALCONIES</text>
  </g>

  <!-- Room 2: Kitchen & Utility -->
  <rect x="104" y="394" width="282" height="207" fill="rgba(16, 36, 58, 0.03)" />
  <g font-family="'Manrope', sans-serif">
    <rect x="104" y="394" width="55" height="207" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
    <text x="245" y="490" font-size="16" font-weight="700" fill="#10243A" text-anchor="middle">MODULAR KITCHEN</text>
    <text x="245" y="510" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">WITH UTILITY BALCONY</text>
  </g>

  <!-- Room 3: Master Bedroom Suite -->
  <rect x="394" y="149" width="222" height="287" fill="rgba(197, 164, 109, 0.06)" />
  <g font-family="'Manrope', sans-serif">
    <text x="505" y="260" font-size="17" font-weight="700" fill="#10243A" text-anchor="middle">MASTER SUITE</text>
    <text x="505" y="285" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">WITH DRESS &amp; ATTACHED</text>
    <rect x="440" y="300" width="130" height="24" rx="4" fill="#FDF8F0" stroke="#C5A46D" stroke-width="0.5" />
    <text x="505" y="316" font-size="11" font-weight="700" fill="#8C6D3B" text-anchor="middle">ATTACHED BATH</text>
  </g>

  <!-- Room 4: Bedroom 2 -->
  <rect x="624" y="149" width="232" height="287" fill="rgba(16, 36, 58, 0.03)" />
  <g font-family="'Manrope', sans-serif">
    <text x="740" y="260" font-size="17" font-weight="700" fill="#10243A" text-anchor="middle">BEDROOM 2</text>
    <text x="740" y="285" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">WITH PRIVATE BALCONY</text>
  </g>

  <!-- Lower Block: Bedroom 3 & Toilets -->
  <rect x="394" y="444" width="112" height="157" fill="rgba(16, 36, 58, 0.03)" />
  <text x="450" y="520" font-family="'Manrope', sans-serif" font-size="14" font-weight="700" fill="#10243A" text-anchor="middle">BEDROOM 3</text>
  <text x="450" y="540" font-family="'Manrope', sans-serif" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle">GUEST / STUDY</text>

  <rect x="514" y="444" width="122" height="157" fill="#F8FAFC" />
  <text x="575" y="520" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#10243A" text-anchor="middle">MASTER</text>
  <text x="575" y="538" font-family="'Manrope', sans-serif" font-size="11" font-weight="600" fill="#8C6D3B" text-anchor="middle">TOILET</text>

  <rect x="644" y="444" width="102" height="157" fill="#F8FAFC" />
  <text x="695" y="520" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#10243A" text-anchor="middle">COMMON</text>
  <text x="695" y="538" font-family="'Manrope', sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">TOILET</text>

  <rect x="754" y="444" width="102" height="157" fill="#FDF8F0" />
  <text x="805" y="520" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#10243A" text-anchor="middle">GRAND</text>
  <text x="805" y="538" font-family="'Manrope', sans-serif" font-size="11" font-weight="600" fill="#8C6D3B" text-anchor="middle">ENTRY FOYER</text>

  <!-- Door Swings -->
  <g stroke="#C5A46D" stroke-width="1.5" fill="none">
    <path d="M 810,605 A 45 45 0 0 1 855,560" stroke-dasharray="3,3" />
    <line x1="810" y1="605" x2="810" y2="560" stroke="#10243A" stroke-width="3" />
    <text x="830" y="630" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#10243A" text-anchor="middle">MAIN ENTRY</text>
  </g>

  <!-- Balcony Labels -->
  <text x="245" y="630" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#C5A46D" text-anchor="middle">WIDE FRONT SUN DECK</text>
  <text x="890" y="290" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#C5A46D" text-anchor="middle" transform="rotate(90, 890, 290)">BEDROOM BALCONY</text>
  <text x="245" y="125" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#C5A46D" text-anchor="middle">KITCHEN UTILITY DECK</text>

  <!-- Footer Disclaimer -->
  <rect x="50" y="640" width="900" height="30" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
  <text x="70" y="660" font-family="'Manrope', sans-serif" font-size="10" font-weight="600" fill="#64748B">
    CONFIRMED ARCHITECTURAL PLAN • 3 BEDROOMS, 2 BATHROOMS, MULTIPLE BALCONIES • DEEPPURA GROUP
  </text>
</svg>

