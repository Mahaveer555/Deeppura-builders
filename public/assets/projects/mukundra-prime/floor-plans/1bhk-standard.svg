<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#EAECEF" stroke-width="0.75" />
    </pattern>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10243A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="680" fill="#FAF9F6" />
  <rect x="25" y="25" width="870" height="630" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="30" y="30" width="860" height="620" fill="url(#grid)" opacity="0.6" />

  <!-- Title Block Header -->
  <rect x="50" y="45" width="820" height="70" rx="8" fill="#10243A" />
  <text x="75" y="78" font-family="'Cinzel', Georgia, serif" font-size="20" font-weight="700" fill="#FAF9F6" letter-spacing="2">MUKUNDRA PRIME</text>
  <text x="75" y="98" font-family="'Manrope', sans-serif" font-size="11" font-weight="600" fill="#C5A46D" letter-spacing="1.5">RESIDENTIAL APARTMENTS • RAIPURA, KOTA</text>
  <rect x="660" y="57" width="190" height="46" rx="6" fill="#172E46" stroke="#C5A46D" stroke-width="1" />
  <text x="755" y="78" font-family="'Cinzel', serif" font-size="15" font-weight="700" fill="#FAF9F6" text-anchor="middle">1 BHK STANDARD</text>
  <text x="755" y="94" font-family="'Manrope', sans-serif" font-size="10" font-weight="600" fill="#C5A46D" text-anchor="middle">OFFICIAL BROCHURE PLAN</text>

  <!-- North Arrow -->
  <g transform="translate(820, 155)">
    <circle cx="0" cy="0" r="20" fill="#FAF9F6" stroke="#10243A" stroke-width="1.5"/>
    <polygon points="0,-16 5,0 0,-4 -5,0" fill="#C5A46D" />
    <polygon points="0,16 5,0 0,4 -5,0" fill="#10243A" />
    <text x="0" y="-21" font-family="'Cinzel', serif" font-size="11" font-weight="800" fill="#10243A" text-anchor="middle">N</text>
  </g>

  <!-- Main Walls (Matching Exact Official Brochure Layout) -->
  <g stroke="#10243A" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter" fill="none">
    <!-- Bedroom Outer Box -->
    <rect x="110" y="150" width="310" height="260" />
    
    <!-- Kitchen -->
    <rect x="420" y="150" width="220" height="160" />
    
    <!-- Balcony -->
    <rect x="640" y="150" width="130" height="160" stroke="#2E7D32" stroke-width="4" fill="rgba(76, 175, 80, 0.1)" />

    <!-- Living Room (Large open room on right) -->
    <path d="M 420,310 L 770,310 L 770,550 L 580,550 L 580,550 L 420,410 Z" />

    <!-- Bathroom -->
    <rect x="270" y="410" width="150" height="90" />

    <!-- WC -->
    <rect x="420" y="410" width="110" height="140" />

    <!-- Cooler Ledge on Bedroom top -->
    <rect x="220" y="115" width="80" height="35" stroke="#64748B" stroke-width="3" stroke-dasharray="4,3" fill="#F1F5F9" />
  </g>

  <!-- Room Interior Labels with Exact Dimensions from Brochure -->
  <!-- 1. Bedroom -->
  <rect x="114" y="154" width="302" height="252" fill="rgba(197, 164, 109, 0.05)" />
  <g font-family="'Manrope', sans-serif">
    <text x="265" y="260" font-size="18" font-weight="800" fill="#10243A" text-anchor="middle">Bed Room</text>
    <rect x="205" y="275" width="120" height="24" rx="4" fill="#FDF8F0" stroke="#C5A46D" stroke-width="0.5" />
    <text x="265" y="291" font-size="12" font-weight="700" fill="#8C6D3B" text-anchor="middle">9.5 x 10 ft.</text>
  </g>

  <!-- Cooler Ledge -->
  <text x="260" y="137" font-family="'Manrope', sans-serif" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">Cooler Ledge</text>

  <!-- 2. Kitchen -->
  <rect x="424" y="154" width="212" height="152" fill="rgba(16, 36, 58, 0.03)" />
  <g font-family="'Manrope', sans-serif">
    <text x="530" y="225" font-size="16" font-weight="800" fill="#10243A" text-anchor="middle">Kitchen</text>
    <rect x="475" y="238" width="110" height="22" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="0.5" />
    <text x="530" y="253" font-size="11" font-weight="700" fill="#10243A" text-anchor="middle">5.5 x 6.5 ft.</text>
  </g>

  <!-- 3. Balcony -->
  <g font-family="'Manrope', sans-serif">
    <text x="705" y="225" font-size="15" font-weight="800" fill="#2E7D32" text-anchor="middle">Balcony</text>
    <rect x="655" y="238" width="100" height="22" rx="4" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="0.5" />
    <text x="705" y="253" font-size="11" font-weight="700" fill="#1B5E20" text-anchor="middle">3 x 5.5 ft.</text>
  </g>

  <!-- 4. Living Room -->
  <g font-family="'Manrope', sans-serif">
    <text x="630" y="420" font-size="19" font-weight="800" fill="#10243A" text-anchor="middle">Living Room</text>
    <rect x="575" y="435" width="110" height="24" rx="4" fill="#FDF8F0" stroke="#C5A46D" stroke-width="0.5" />
    <text x="630" y="451" font-size="13" font-weight="700" fill="#8C6D3B" text-anchor="middle">9 x 11 ft.</text>
    <rect x="710" y="470" width="56" height="76" rx="4" fill="#334155" />
    <text x="738" y="515" font-size="10" font-weight="600" fill="#FAF9F6" text-anchor="middle">SOFA</text>
  </g>

  <!-- 5. Bathroom -->
  <rect x="274" y="414" width="142" height="82" fill="#E0F2FE" />
  <g font-family="'Manrope', sans-serif">
    <text x="345" y="448" font-size="13" font-weight="700" fill="#0369A1" text-anchor="middle">Bathroom</text>
    <text x="345" y="466" font-size="10.5" font-weight="600" fill="#0284C7" text-anchor="middle">4 x 3.25 ft.</text>
  </g>

  <!-- 6. WC -->
  <rect x="424" y="414" width="102" height="132" fill="#F8FAFC" />
  <g font-family="'Manrope', sans-serif">
    <text x="475" y="475" font-size="13" font-weight="700" fill="#10243A" text-anchor="middle">WC</text>
    <text x="475" y="495" font-size="10.5" font-weight="600" fill="#64748B" text-anchor="middle">3 x 3.25 ft.</text>
  </g>

  <!-- Door Swings & Arcs -->
  <g stroke="#C5A46D" stroke-width="1.75" fill="none">
    <!-- Main Entrance Door -->
    <path d="M 580,550 A 45 45 0 0 1 625,505" stroke-dasharray="3,3" />
    <line x1="580" y1="550" x2="580" y2="505" stroke="#10243A" stroke-width="3" />
    <text x="555" y="575" font-family="'Manrope', sans-serif" font-size="11" font-weight="800" fill="#10243A">MAIN ENTRY</text>

    <!-- Bedroom Door -->
    <path d="M 370,410 A 35 35 0 0 1 405,375" stroke-dasharray="3,3" />

    <!-- Kitchen Entry -->
    <line x1="420" y1="310" x2="470" y2="310" stroke="#C5A46D" stroke-width="1" stroke-dasharray="3,3" />
  </g>

  <!-- Footer Authenticity Bar -->
  <rect x="50" y="605" width="820" height="35" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
  <text x="70" y="627" font-family="'Manrope', sans-serif" font-size="10.5" font-weight="700" fill="#10243A">
    VERIFIED BROCHURE MEASUREMENTS: Bed Room (9.5x10 ft.) • Living Room (9x11 ft.) • Kitchen (5.5x6.5 ft.) • Balcony (3x5.5 ft.) • Bathroom (4x3.25 ft.) • WC (3x3.25 ft.)
  </text>
</svg>
